name: "S2DM Docs Build"
description: "Build and deploy a Docusaurus documentation site for an s2dm modeling project"
author: "COVESA"

inputs:
  project-title:
    description: "Human-readable project title shown in the navbar and homepage."
    required: true

  project-name:
    description: "Machine-readable project name used as the repo slug."
    required: true

  org-name:
    description: "GitHub organization name."
    required: true

  pages-url:
    description: "Full URL where the site is deployed (e.g. https://myorg.github.io/my-model)."
    required: true

  github-repo-url:
    description: "Full URL to the GitHub repository (e.g. https://github.com/myorg/my-model)."
    required: true

  schema-sources:
    description: >
      Space-separated list of directories or files passed to `s2dm compose -s`.
      Each token becomes one `-s` flag. Paths are relative to the repo root.
      Example: "spec" or "spec/core spec/extensions/seat.graphql"
    required: true

  s2dm-version:
    description: "s2dm version to install (e.g. '0.22.0'). Omit to use the latest release."
    required: false
    default: ""

  units-version:
    description: "QUDT units version to sync into external/units (e.g. 'v3.1.11')."
    required: false
    default: ""

outputs:
  page-url:
    description: "The URL of the deployed GitHub Pages site"
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: "composite"
  steps:
    - name: Install Python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.1"

    # Install s2dm as a CLI tool (isolated from the adopter's own venv).
    - name: Install s2dm
      shell: bash
      run: |
        if [ -n "${{ inputs.s2dm-version }}" ]; then
          uv tool install "s2dm==${{ inputs.s2dm-version }}"
        else
          uv tool install s2dm
        fi

    - name: Sync QUDT units
      shell: bash
      run: s2dm units sync -d external/units --version "${{ inputs.units-version }}"

    # Build the -s flags string from the space-separated schema-sources input.
    # e.g. "spec/core spec/seat.graphql" → "-s spec/core -s spec/seat.graphql"
    - name: Build compose flags
      id: sources
      shell: bash
      run: |
        FLAGS=""
        for src in ${{ inputs.schema-sources }}; do
          FLAGS="$FLAGS -s $src"
        done
        echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

    # Compose all schema files into a single dist/model.graphql that
    # Docusaurus reads when generating the API reference.
    - name: Compose model.graphql
      shell: bash
      run: |
        mkdir -p dist
        s2dm compose ${{ steps.sources.outputs.flags }} -o dist/model.graphql

    # Scaffold the Docusaurus website into ./website using the template
    # bundled with s2dm. No website files need to be checked into the repo.
    - name: Scaffold Docusaurus website
      shell: bash
      run: |
        s2dm docs scaffold \
          --project-title "${{ inputs.project-title }}" \
          --project-name  "${{ inputs.project-name }}" \
          --org-name      "${{ inputs.org-name }}" \
          --pages-url     "${{ inputs.pages-url }}" \
          --github-repo-url "${{ inputs.github-repo-url }}" \
          --output website

    - name: Set up Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: website/package-lock.json

    # Install Node dependencies using the lock file shipped inside the
    # s2dm template (ensures reproducible builds without extra network calls).
    - name: Install website dependencies
      shell: bash
      run: npm ci
      working-directory: website

    # generate-introspection.js writes static/introspection.json, then
    # graphql-to-doc builds the full API reference under docs/api/.
    - name: Generate introspection + GraphQL API docs
      shell: bash
      run: npm run doc
      working-directory: website

    - name: Build site
      shell: bash
      run: npm run build
      working-directory: website

    - name: Configure GitHub Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: website/build

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # tagged both v5.0.0 and v3.0.2-node.24
