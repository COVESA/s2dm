name: ci

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: install node dependencies
        run: npm install

      - name: playground tests
        run: npm test --workspace playground

      - name: uv
        uses: astral-sh/setup-uv@v7

      - name: sync
        run: |
          uv sync --frozen

      - name: pre-commit
        run: |
          uv run pre-commit run --all-files

      - name: gitlint
        run: |
          # Determine base branch - use PR base if in PR, otherwise main
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_BRANCH="${{ github.base_ref }}"
          else
            BASE_BRANCH="main"
          fi
          echo "Using base branch: $BASE_BRANCH"
          # Run gitlint on commits since base branch
          uv run gitlint --commits $(git merge-base HEAD origin/$BASE_BRANCH)..HEAD

      - name: mypy
        run: |
          uv run mypy src/ tests/

      - name: test
        run: |
          uv run nox

  website:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: uv
        uses: astral-sh/setup-uv@v7

      - name: sync
        run: uv sync --frozen

      - name: compose schema
        run: |
          mkdir -p dist
          uv run s2dm compose -s tests/data/ci_model.graphql -o dist/model.graphql

      - name: scaffold website
        run: |
          uv run s2dm docs scaffold \
            --project-title "CI Model" \
            --project-name ci-model \
            --org-name covesa \
            --pages-url https://covesa.github.io/ci-model \
            --github-repo-url https://github.com/COVESA/ci-model \
            --output website

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: install website dependencies
        run: npm ci
        working-directory: website

      - name: typecheck
        run: npm run typecheck
        working-directory: website

      - name: generate docs
        run: uv run --project "$GITHUB_WORKSPACE" npm run doc
        working-directory: website

      - name: build
        run: npm run build
        working-directory: website
