<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GraphQL Voyager</title>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #voyager {
        height: 100vh;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/graphql-voyager@2/dist/voyager.css"
    />
  </head>
  <body>
    <div id="voyager"></div>
    <script src="https://cdn.jsdelivr.net/npm/graphql-voyager@2/dist/voyager.standalone.js"></script>
    <script>
      fetch(new URL("introspection.json", document.baseURI).href)
        .then((r) => r.json())
        .then((introspection) => {
          GraphQLVoyager.renderVoyager(document.getElementById("voyager"), {
            introspection,
          });
        });
    </script>
  </body>
</html>
